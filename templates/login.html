<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topo">
    <div class="topo-conteudo">
        <span class="topo-selo">GC</span>
        <div>
            <h1>Gestão de Clientes</h1>
            <p class="topo-sub">Entrar no sistema</p>
        </div>
        <nav class="menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/clientes">Clientes</a>
            <a href="/servicos">Serviços</a>
            <a href="/logout">Sair</a>
        </nav>
    </div>
</header>

    <main class="main-auth">

        <section class="cartao cartao-auth">
            <h2><span class="marcador"></span>Login</h2>
            <form action="/login" method="POST">
                {% if erro %}
                    <p class="mensagem-erro">{{ erro }}</p>
                {% endif %}

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p class="link-auxiliar">Não tem conta? <a href="/registrar">Criar conta</a></p>
        </section>

    </main>

</body>
</html>
